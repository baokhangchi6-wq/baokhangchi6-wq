name: Build Global IPA
# Debug crash isolation: preserve Roblox sky and animation assets.

# ─────────────────────────────────────────────────────────────────────────────
# Immediate threshold = 0: build as soon as ANY new App Store version appears.
# No 2-version distance or 21-day age gate (unlike Android global-arm64 lane).
# Mirrors the structure of Android's build_global_arm64.yml for consistency.
# ─────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [ main ]
    paths:
      - 'tools/**'
      - 'resources/**'
      - 'roblox/**'
      - 'patterns.ios.json'
      - '.github/workflows/build_roblox_ios_arm64.yml'
  schedule:
    # Check every 3 hours (at :17 past the hour) — Roblox iOS releases are faster
    # than Android, so we poll more frequently to catch updates immediately.
    - cron: '17 */3 * * *'

  workflow_dispatch:
    inputs:
      ipa_url:
        description: 'Direct HTTPS URL to decrypted Roblox .ipa (overrides auto-detect)'
        required: false
        type: string
        default: ''
      force_rebuild:
        description: 'Force rebuild even if version was already built'
        required: false
        default: false
        type: boolean
      build_type:
        description: 'Debug for device FPS checks; Release for publishing'
        required: true
        type: choice
        options: [debug, release]
        default: debug

permissions:
  contents: write

concurrency:
  group: roblox-ios-arm64-dedicated
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90
    env:
      MASTERSTRAP_BUILD_TYPE: debug

    steps:
      - name: Checkout iOS lane
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml capstone Pillow requests

      - name: Check FPS policy and native source contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q tools roblox
          for suite in test_scanner.py test_macho.py test_verification.py test_writers.py; do
            PYTHONPATH=roblox python -m unittest discover -s roblox/tests -t roblox -p "$suite" -v
          done
          PYTHONPATH=roblox python -m unittest discover -s roblox/tests -p test_ios_display_policy.py -v
          python tools/check_ios_luau_audit.py
          python tools/verify_ios_android_shader_parity.py --expect-disabled
          python tools/check_ios_crash_isolation.py
          PYTHONPATH=roblox python -c 'from tools.build_integrated_roblox_ipa import LUAU_SHADER_PAYLOAD; assert "androidProfiles" in LUAU_SHADER_PAYLOAD; print("PASS: builder payload imports")'
          clang -std=c11 -Wall -Wextra -Werror -I tools \
            roblox/tests/ios_frame_policy_test.c -o "$RUNNER_TEMP/ios-fps-policy-check"
          "$RUNNER_TEMP/ios-fps-policy-check"
          PYTHONPATH=roblox python -c 'import os; from pathlib import Path; from tools.build_integrated_roblox_ipa import generate_native_hook_source; (Path(os.environ["RUNNER_TEMP"]) / "masterstrap-fps-source.c").write_text(generate_native_hook_source([], [], 0, [], {}), encoding="utf-8")'
          clang -target arm64-apple-ios14.0 -fsyntax-only -Wno-everything "$RUNNER_TEMP/masterstrap-fps-source.c"

      # ── STEP 1: Version Gate (threshold = 0, IMMEDIATE) ──────────────────
      - name: Check Roblox iOS App Store version (threshold=0)
        id: version_gate
        shell: bash
        run: |
          FORCE="${{ inputs.force_rebuild || 'false' }}"
          if [ "${{ github.event_name }}" = "push" ]; then
            FORCE="true"
          fi
          FORCE_ARG=""
          if [ "$FORCE" = "true" ]; then
            FORCE_ARG="--force"
          fi
          python tools/check_roblox_ios_version.py \
            --checkpoint-file last_built_roblox_ios_version.json \
            $FORCE_ARG
          # Output: should_build, store_version, last_version

      # ── STEP 2: Resolve & Download Decrypted Roblox IPA ─────────────────
      - name: Resolve & Download Decrypted Roblox iOS IPA
        if: steps.version_gate.outputs.should_build == 'true'
        id: prepare_ipa
        shell: bash
        env:
          INPUT_IPA_URL: ${{ github.event.inputs.ipa_url }}
          SECRET_IPA_URL: ${{ secrets.IOS_IPA_URL }}
          STORE_VERSION: ${{ steps.version_gate.outputs.store_version }}
        run: |
          set -euo pipefail
          mkdir -p roblox_input output

          URL_ARG=""
          if [ -n "$INPUT_IPA_URL" ]; then
            URL_ARG="--url $INPUT_IPA_URL"
          elif [ -n "$SECRET_IPA_URL" ]; then
            URL_ARG="--url $SECRET_IPA_URL"
          fi

          python tools/fetch_roblox_ios_ipa.py \
            $URL_ARG \
            --output roblox_input/roblox.ipa



      # ── STEP 3: Auto-dump offsets from IPA ───────────────────────────────
      - name: Auto Dump iOS Offsets & FFlags from IPA
        if: steps.version_gate.outputs.should_build == 'true'
        shell: bash
        run: |
          echo "=== [1/4] Running iOS Dumper ==="
          mkdir -p output

          if [ "${{ steps.prepare_ipa.outputs.available }}" != "true" ]; then
            echo "Exact decrypted IPA is required; refusing stale remote offsets."
            exit 1
          fi

          rm -f output/manifest.json output/offsets.json output/offset_candidates.json \
            output/fflags.json output/flag_scan.json output/Offsets.hpp output/FFlags.hpp \
            output/fflags_map.hpp
          PYTHONPATH=roblox python -m roblox_ios_dumper dump \
            "${{ steps.prepare_ipa.outputs.ipa_path }}" \
            --patterns patterns.ios.json \
            -o output
          PYTHONPATH=roblox python -m roblox_ios_dumper verify output \
            --input "${{ steps.prepare_ipa.outputs.ipa_path }}" \
            --patterns patterns.ios.json
          python tools/audit_ios_luau.py \
            "${{ steps.prepare_ipa.outputs.ipa_path }}" \
            --offsets output/offsets.json \
            --output output/workflow/luau_audit.json
          python tools/prepare_ios_workflow_profile.py \
            --output output \
            --version "${{ steps.version_gate.outputs.store_version }}"
          python tools/check_ios_workflow_profile.py
          echo "Dumper and exact-binary workflow profile complete."
          ls -la output/ output/workflow/

      # ── STEP 4: Build Masterstrap iOS Native Hook & IPA ──────────────────
      - name: Build Masterstrap iOS Native Hook & Integrate IPA
        if: steps.version_gate.outputs.should_build == 'true'
        id: build_ipa
        shell: bash
        run: |
          echo "=== [2/4] Compiling Native Hook & Packaging IPA ==="

          IPA_ARG=""
          if [ "${{ steps.prepare_ipa.outputs.available }}" = "true" ]; then
            IPA_ARG="--input-ipa ${{ steps.prepare_ipa.outputs.ipa_path }}"
          fi

          HPP_ARG=""
          if [ -f "output/FFlags.hpp" ]; then
            HPP_ARG="--hpp output/FFlags.hpp"
          fi

          python tools/build_integrated_roblox_ipa.py \
            $IPA_ARG \
            $HPP_ARG \
            --out-dir output \
            --workflow-profile output/workflow/profile.json \
            --disable-shader \
            --disable-stretch \
            --build-type "$MASTERSTRAP_BUILD_TYPE"

          # Collect IPA info emitted by builder to GITHUB_OUTPUT
          if compgen -G "output/Masterstrap-*.ipa" > /dev/null; then
            IPA_FILE=$(ls output/Masterstrap-*.ipa | head -n 1)
            IPA_NAME=$(basename "$IPA_FILE")
            # Extract version from filename: Masterstrap-2.740.1234.ipa -> 2.740.1234
            IPA_VERSION=$(echo "$IPA_NAME" | sed 's/^Masterstrap-//' | sed 's/\.ipa$//')
            echo "ipa_name=$IPA_NAME" >> "$GITHUB_OUTPUT"
            echo "ipa_version=$IPA_VERSION" >> "$GITHUB_OUTPUT"
            echo "has_ipa=true" >> "$GITHUB_OUTPUT"
            echo "SUCCESS: Built $IPA_NAME ($(du -sh "$IPA_FILE" | cut -f1))"
          else
            echo "has_ipa=false" >> "$GITHUB_OUTPUT"
            echo "ipa_name=" >> "$GITHUB_OUTPUT"
            echo "ipa_version=${{ steps.version_gate.outputs.store_version }}" >> "$GITHUB_OUTPUT"
          fi

      # ── STEP 5: Print Diagnostic Log ─────────────────────────────────────
      - name: Verify shader-disabled crash-isolation IPA
        if: steps.build_ipa.outputs.has_ipa == 'true'
        shell: bash
        run: |
          set -euo pipefail
          IPA_FILE=$(ls output/Masterstrap-*.ipa | head -n 1)
          python tools/verify_ios_android_shader_parity.py --ipa "$IPA_FILE" --expect-disabled --input-ipa "${{ steps.prepare_ipa.outputs.ipa_path }}"

      - name: Inspect Feature Diagnostic Log
        if: steps.version_gate.outputs.should_build == 'true'
        shell: bash
        run: |
          echo "=== [3/4] Feature Diagnostic Report ==="
          if [ -f "output/flag_inject_report.log" ]; then
            cat output/flag_inject_report.log
          fi
          echo ""
          echo "=== Offset Map Summary ==="
          if [ -f "output/Offsets.hpp" ]; then
            echo "Offsets.hpp line count: $(wc -l < output/Offsets.hpp)"
            grep "constexpr" output/Offsets.hpp | wc -l | xargs echo "Exported offsets count:"
          fi
          echo ""
          echo "=== FFlags Map Summary ==="
          if [ -f "output/FFlags.hpp" ]; then
            grep "constexpr" output/FFlags.hpp | wc -l | xargs echo "FFlags count:"
          fi

      # ── STEP 6: Upload debug artifact; publish only release builds ────────
      - name: Upload Debug IPA for device FPS checks
        if: steps.build_ipa.outputs.has_ipa == 'true' && env.MASTERSTRAP_BUILD_TYPE == 'debug'
        uses: actions/upload-artifact@v4
        with:
          name: ios-crash-isolation-debug-${{ github.sha }}-run-${{ github.run_number }}
          path: |
            output/Masterstrap-*.ipa
            output/workflow/profile.json
            output/workflow/profile.hpp
            output/workflow/luau_audit.json
            output/manifest.json
            output/offsets.json
            output/offset_candidates.json
          if-no-files-found: error
          retention-days: 7

      - name: Publish Masterstrap iOS IPA to GitHub Release
        if: steps.version_gate.outputs.should_build == 'true' && steps.build_ipa.outputs.has_ipa == 'true' && env.MASTERSTRAP_BUILD_TYPE == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-arm64-${{ steps.build_ipa.outputs.ipa_version }}-run-${{ github.run_number }}
          name: Masterstrap ${{ steps.build_ipa.outputs.ipa_version }} (iOS ARM64)
          make_latest: true
          prerelease: false
          body: |
            ## Masterstrap iOS ARM64 — ${{ steps.build_ipa.outputs.ipa_version }}

            - **Platform:** iOS ARM64
            - **Roblox Version:** `${{ steps.build_ipa.outputs.ipa_version }}`
            - **App Store Version:** `${{ steps.version_gate.outputs.store_version }}`
            - **Build Run:** `#${{ github.run_number }}`
            - **Trigger Policy:** Immediate (threshold=0 — builds on any new App Store version)

            ### Ready to sideload via:
            - TrollStore (recommended)
            - AltStore / AltServer
            - Sideloadly
            - Scarlet

            ### What's included:
            - ✅ Cloud Bridge Protocol v2 (`masterstrap-rbx-bridge-v1://`)
            - Engine FPS target independent of display Hz; CADisplayLink uses actual display limits
            - ✅ Direct-RVA FastFlag write engine
            - ✅ Dynamic JSON config (ClientAppSettings.json + TurboProfile)
            - ✅ Full diagnostic log: `masterstrap_ios.log` (runtime gates report verified vs profile-only features)

            > **Note:** Open Masterstrap app first to get the launch authorization token, then open Roblox.
          files: |
            output/Masterstrap-*.ipa
        env:

          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── STEP 7: Advance iOS checkpoint ───────────────────────────────────
      - name: Advance iOS version checkpoint
        if: steps.version_gate.outputs.should_build == 'true' && steps.build_ipa.outputs.has_ipa == 'true' && env.MASTERSTRAP_BUILD_TYPE == 'release'
        shell: bash
        env:
          BUILT_VERSION: ${{ steps.build_ipa.outputs.ipa_version }}
          STORE_VERSION: ${{ steps.version_gate.outputs.store_version }}
        run: |
          set -euo pipefail
          TARGET_VER="${BUILT_VERSION:-$STORE_VERSION}"
          python tools/check_roblox_ios_version.py \
            --checkpoint-file last_built_roblox_ios_version.json \
            --expected-version "$TARGET_VER" \
            --advance-checkpoint \
            --force


          git config user.name 'Masterstrap'
          git config user.email 'contact@masterstrap.org'
          git add last_built_roblox_ios_version.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update iOS ARM64 checkpoint $BUILT_VERSION"
            git push origin HEAD
          fi
