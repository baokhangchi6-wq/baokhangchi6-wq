name: Clean Masterstrap History

on:
  schedule:
    - cron: '37 17 * * *'
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type DELETE_ALL to delete old completed runs, releases, and tags'
        required: true
        type: string

permissions:
  actions: write
  contents: write

concurrency:
  group: cleanup-masterstrap-history-${{ github.repository }}
  cancel-in-progress: false

jobs:
  cleanup:
    if: (github.repository == 'baokhangchi6-wq/baokhangchi6-wq' || github.repository == 'Masterstrap/IOS-source') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Delete old workflow runs, releases, and tags
        uses: actions/github-script@v7
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        with:
          script: |
            if (context.eventName !== 'schedule' && process.env.CONFIRMATION !== 'DELETE_ALL') {
              throw new Error('Manual cleanup requires DELETE_ALL');
            }

            const { owner, repo } = context.repo;
            const current = await github.rest.actions.getWorkflowRun({ owner, repo, run_id: context.runId });
            const cutoff = current.data.created_at;
            const counts = { runs: 0, releases: 0, tags: 0 };
            const failures = [];

            async function remove(kind, label, request) {
              try {
                await request();
                counts[kind]++;
                core.info(`Deleted ${kind}: ${label}`);
              } catch (error) {
                if (error.status !== 404) {
                  failures.push(`${kind}: ${label} (HTTP ${error.status || 'unknown'})`);
                  core.warning(failures[failures.length - 1]);
                }
              }
              await new Promise(resolve => setTimeout(resolve, 750));
            }

            const releases = await github.paginate(github.rest.repos.listReleases, { owner, repo, per_page: 100 });
            for (const release of releases) {
              if (release.created_at < cutoff) {
                await remove('releases', release.id, () => github.rest.repos.deleteRelease({ owner, repo, release_id: release.id }));
              }
            }

            const tags = await github.paginate(github.rest.git.listMatchingRefs, { owner, repo, ref: 'tags/', per_page: 100 });
            for (const tag of tags) {
              const name = tag.ref.slice('refs/tags/'.length);
              await remove('tags', name, () => github.rest.git.deleteRef({ owner, repo, ref: `tags/${name}` }));
            }

            const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
              owner, repo, status: 'completed', per_page: 100
            });
            for (const run of runs) {
              if (run.id !== context.runId && run.created_at < cutoff) {
                await remove('runs', run.id, () => github.rest.actions.deleteWorkflowRun({ owner, repo, run_id: run.id }));
              }
            }

            await core.summary.addHeading(`${owner}/${repo} history cleanup`).addTable([
              [{ data: 'Resource', header: true }, { data: 'Deleted', header: true }],
              ...Object.entries(counts).map(([kind, count]) => [kind, String(count)])
            ]).addRaw(`\nFailed deletions: ${failures.length}\n`).write();

            if (failures.length) {
              core.setFailed('Some deletions failed; check permissions or protected tags.');
            }
