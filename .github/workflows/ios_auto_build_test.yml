name: Masterstrap Roblox iOS Auto Build & Test

on:
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "Direct HTTPS URL to Decrypted Roblox .ipa binary (e.g. GitHub Releases / Direct CDN link)"
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:
  build-and-test:
    # LevelPlay 9.6 requires Xcode 26. The macos-26 runner provides it as the
    # default toolchain, while macos-14 is in deprecation and cannot link this SDK.
    runs-on: macos-26
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pyyaml capstone Pillow

      - name: Verify iOS bridge and ad-gate contracts
        run: |
          PYTHONPATH=roblox python -m unittest discover -s roblox/tests -t roblox -p 'test_*.py' -v

      - name: Build Masterstrap iOS with official LevelPlay SDK & Unity Ads
        id: levelplay
        shell: bash
        env:
          IOS_LEVELPLAY_APP_KEY: ${{ secrets.IOS_LEVELPLAY_APP_KEY || '28072d93d' }}
          IOS_LEVELPLAY_REWARDED_ID: ${{ secrets.IOS_LEVELPLAY_REWARDED_ID || 'Rewarded_iOS' }}
          IOS_LEVELPLAY_BANNER_ID: ${{ secrets.IOS_LEVELPLAY_BANNER_ID || 'Banner_iOS' }}
          IOS_LEVELPLAY_INTERSTITIAL_ID: ${{ secrets.IOS_LEVELPLAY_INTERSTITIAL_ID || 'Interstitial_iOS' }}
        run: |
          curl -fL --retry 3 \
            "https://raw.githubusercontent.com/ironsource-mobile/iOS-sdk/master/9.6.0/IronSource9.6.0.zip" \
            -o /tmp/IronSource9.6.0.zip
          curl -fL --retry 3 \
            "https://raw.githubusercontent.com/ironsource-mobile/iOS-adapters/master/unityads-adapter/5.11.0/ISUnityAdsAdapter5.11.0.zip" \
            -o /tmp/ISUnityAdsAdapter5.11.0.zip
          curl -fL --retry 3 \
            "https://github.com/Unity-Technologies/unity-ads-ios/releases/download/4.20.0/UnityAds.zip" \
            -o /tmp/UnityAds.zip
          rm -rf /tmp/masterstrap-levelplay
          mkdir -p /tmp/masterstrap-levelplay output
          ditto -x -k /tmp/IronSource9.6.0.zip /tmp/masterstrap-levelplay
          ditto -x -k /tmp/ISUnityAdsAdapter5.11.0.zip /tmp/masterstrap-levelplay
          ditto -x -k /tmp/UnityAds.zip /tmp/masterstrap-levelplay/UnityAds
          LEVELPLAY_FRAMEWORK=$(find /tmp/masterstrap-levelplay -type d -name "IronSource.framework" | grep "ios-arm64/" | grep -v "simulator" | head -n 1)
          UNITYADS_ADAPTER_FRAMEWORK=$(find /tmp/masterstrap-levelplay -type d -name "ISUnityAdsAdapter.framework" | grep "ios-arm64/" | grep -v "simulator" | head -n 1)
          UNITYADS_FRAMEWORK=$(find /tmp/masterstrap-levelplay -type d -name "UnityAds.framework" | grep "ios-arm64/" | grep -v "simulator" | head -n 1)
          echo "IronSource Framework: $LEVELPLAY_FRAMEWORK"
          echo "ISUnityAdsAdapter Framework: $UNITYADS_ADAPTER_FRAMEWORK"
          echo "UnityAds Framework: $UNITYADS_FRAMEWORK"
          test -n "$LEVELPLAY_FRAMEWORK" && test -f "$LEVELPLAY_FRAMEWORK/IronSource"
          test -n "$UNITYADS_ADAPTER_FRAMEWORK" && test -f "$UNITYADS_ADAPTER_FRAMEWORK/ISUnityAdsAdapter"
          test -n "$UNITYADS_FRAMEWORK" && test -f "$UNITYADS_FRAMEWORK/UnityAds"
          python tools/build_masterstrap_app_ipa.py \
            --out-dir output \
            --levelplay-framework "$LEVELPLAY_FRAMEWORK" \
            --unityads-adapter-framework "$UNITYADS_ADAPTER_FRAMEWORK" \
            --unityads-framework "$UNITYADS_FRAMEWORK"
          set -euo pipefail
          bash tools/embed_swift_runtime_in_ipa.sh output/Masterstrap.ipa
          test -s output/Masterstrap.ipa
          echo "enabled=true" >> "$GITHUB_OUTPUT"

      - name: Resolve & Download Decrypted Roblox iOS IPA
        id: prepare-ipa
        shell: bash
        env:
          INPUT_IPA_URL: ${{ github.event.inputs.ipa_url }}
          SECRET_IPA_URL: ${{ secrets.IOS_IPA_URL }}
        run: |
          mkdir -p roblox_input output
          IPA_PATH="roblox_input/roblox.ipa"
          
          TARGET_URL="$INPUT_IPA_URL"
          if [ -z "$TARGET_URL" ]; then
            TARGET_URL="$SECRET_IPA_URL"
          fi
          
          if [ -z "$TARGET_URL" ]; then
            echo "Searching public verified decrypted mirrors for Roblox IPA..."
            MIRROR=$(curl -s "https://api.github.com/repos/ipahub/roblox/releases/latest" | grep -o 'https://github.com/ipahub/roblox/releases/download/[^"]*\.ipa' | head -n 1 || echo "")
            if [ -n "$MIRROR" ]; then
              TARGET_URL="$MIRROR"
              echo "Found mirror: $TARGET_URL"
            fi
          fi
          
          if [ -n "$TARGET_URL" ]; then
            echo "Downloading IPA from: $TARGET_URL"
            curl -L -A "Mozilla/5.0 (Macintosh; Intel Mac OS X 10_15_7)" --retry 3 -o "$IPA_PATH" "$TARGET_URL" || true
          fi
          
          # Validate if the downloaded file is a valid ZIP/IPA archive
          IS_VALID_ZIP=$(python -c "
          import zipfile, sys
          from pathlib import Path
          p = Path('$IPA_PATH')
          if p.is_file() and p.stat().st_size > 1024*1024:
              try:
                  with zipfile.ZipFile(p, 'r') as z:
                      if any('Payload/' in n for n in z.namelist()[:20]):
                          print('true')
                          sys.exit(0)
              except Exception:
                  pass
          print('false')
          ")
          
          if [ "$IS_VALID_ZIP" = "true" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "ipa_path=$IPA_PATH" >> "$GITHUB_OUTPUT"
            echo "SUCCESS: Valid Roblox IPA archive confirmed ($(du -h "$IPA_PATH" | cut -f1))"
          else
            echo "WARNING: The provided URL did not return a direct .ipa binary archive (it may be an HTML webpage or expired link)."
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "ipa_path=" >> "$GITHUB_OUTPUT"
            rm -f "$IPA_PATH"
          fi

      - name: Auto Dump Offsets & FFlags from IPA
        run: |
          echo "=== [1/4] Running iOS Dumper ==="
          mkdir -p output
          if [ "${{ steps.prepare-ipa.outputs.available }}" = "true" ]; then
            python -m roblox_ios_dumper dump "${{ steps.prepare-ipa.outputs.ipa_path }}" -o output
          else
            echo "Downloading live verified FFlags and Offsets header from masterstrap.org..."
            curl -s -L "https://masterstrap.org/Data/IOS/IOS_FFlags.hpp" -o "output/FFlags.hpp" || true
            curl -s -L "https://masterstrap.org/Data/IOS/IOS_Offsets.hpp" -o "output/Offsets.hpp" || true
          fi

      - name: Build Masterstrap iOS Native Hook & Integrate IPA
        run: |
          echo "=== [2/4] Compiling Native Hook & Generating Reports ==="
          python tools/build_integrated_roblox_ipa.py \
            --input-ipa "${{ steps.prepare-ipa.outputs.ipa_path }}" \
            --hpp "output/FFlags.hpp" \
            --out-dir "output" \
            --no-embedded-flags

      - name: Inspect Verification Log & Miss Offsets
        run: |
          echo "=== [3/4] Inspection Log & Miss Offsets Report ==="
          if [ -f "output/flag_inject_report.log" ]; then
            cat output/flag_inject_report.log
          fi

      - name: Check Built IPAs
        id: check-ipas
        shell: bash
        run: |
          ls -la output/
          if compgen -G "output/*.ipa" > /dev/null; then
            echo "has_ipa=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_ipa=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish iOS IPA to GitHub Release
        if: steps.check-ipas.outputs.has_ipa == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-ios-${{ github.run_number }}
          name: Masterstrap iOS (Build ${{ github.run_number }})
          body: |
            ## Masterstrap iOS Release (Build ${{ github.run_number }})
            - Direct Release of Masterstrap iOS IPA for real device testing.
            - Ready to sideload via TrollStore, AltStore, Sideloadly, or Scarlet.
            - Includes official LevelPlay SDK & Unity Ads mediation.
            - 100% Android parity: Rewarded Ads, Settings Persistence, License Key lifecycle, FastFlag Editor, and clean animations.
          files: |
            output/*.ipa
            output/flag_inject_report.log
            output/FFlags.hpp
            output/Offsets.hpp
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
