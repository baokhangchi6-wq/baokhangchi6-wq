name: Masterstrap Roblox iOS Auto Build & Test

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "Direct HTTPS URL to Decrypted Roblox .ipa binary (e.g. GitHub Releases / Direct CDN link)"
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pyyaml capstone

      - name: Resolve & Download Decrypted Roblox iOS IPA
        id: prepare-ipa
        shell: bash
        env:
          INPUT_IPA_URL: ${{ github.event.inputs.ipa_url }}
          SECRET_IPA_URL: ${{ secrets.IOS_IPA_URL }}
        run: |
          mkdir -p roblox_input output
          IPA_PATH="roblox_input/roblox.ipa"
          
          TARGET_URL="$INPUT_IPA_URL"
          if [ -z "$TARGET_URL" ]; then
            TARGET_URL="$SECRET_IPA_URL"
          fi
          
          if [ -z "$TARGET_URL" ]; then
            echo "Searching public verified decrypted mirrors for Roblox IPA..."
            MIRROR=$(curl -s "https://api.github.com/repos/ipahub/roblox/releases/latest" | grep -o 'https://github.com/ipahub/roblox/releases/download/[^"]*\.ipa' | head -n 1 || echo "")
            if [ -n "$MIRROR" ]; then
              TARGET_URL="$MIRROR"
              echo "Found mirror: $TARGET_URL"
            fi
          fi
          
          if [ -n "$TARGET_URL" ]; then
            echo "Downloading IPA from: $TARGET_URL"
            curl -L -A "Mozilla/5.0 (Macintosh; Intel Mac OS X 10_15_7)" --retry 3 -o "$IPA_PATH" "$TARGET_URL" || true
          fi
          
          # Validate if the downloaded file is a valid ZIP/IPA archive
          IS_VALID_ZIP=$(python -c "
          import zipfile, sys
          from pathlib import Path
          p = Path('$IPA_PATH')
          if p.is_file() and p.stat().st_size > 1024*1024:
              try:
                  with zipfile.ZipFile(p, 'r') as z:
                      if any('Payload/' in n for n in z.namelist()[:20]):
                          print('true')
                          sys.exit(0)
              except Exception:
                  pass
          print('false')
          ")
          
          if [ "$IS_VALID_ZIP" = "true" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "ipa_path=$IPA_PATH" >> "$GITHUB_OUTPUT"
            echo "SUCCESS: Valid Roblox IPA archive confirmed ($(du -h "$IPA_PATH" | cut -f1))"
          else
            echo "WARNING: The provided URL did not return a direct .ipa binary archive (it may be an HTML webpage or expired link)."
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "ipa_path=" >> "$GITHUB_OUTPUT"
            rm -f "$IPA_PATH"
          fi

      - name: Auto Dump Offsets & FFlags from IPA
        run: |
          echo "=== [1/4] Running iOS Dumper ==="
          mkdir -p output
          if [ "${{ steps.prepare-ipa.outputs.available }}" = "true" ]; then
            python -m roblox_ios_dumper dump "${{ steps.prepare-ipa.outputs.ipa_path }}" -o output
          else
            echo "Downloading live verified FFlags and Offsets header from masterstrap.org..."
            curl -s -L "https://masterstrap.org/Data/IOS/IOS_FFlags.hpp" -o "output/FFlags.hpp" || true
            curl -s -L "https://masterstrap.org/Data/IOS/IOS_Offsets.hpp" -o "output/Offsets.hpp" || true
          fi

      - name: Build Masterstrap iOS Native Hook & Integrate IPA
        run: |
          echo "=== [2/4] Compiling Native Hook & Generating Reports ==="
          python tools/build_integrated_roblox_ipa.py \
            --input-ipa "${{ steps.prepare-ipa.outputs.ipa_path }}" \
            --hpp "output/FFlags.hpp" \
            --out-dir "output"

      - name: Inspect Verification Log & Miss Offsets
        run: |
          echo "=== [3/4] Inspection Log & Miss Offsets Report ==="
          if [ -f "output/flag_inject_report.log" ]; then
            cat output/flag_inject_report.log
          fi

      - name: Upload Build Artifacts & Logs
        uses: actions/upload-artifact@v4
        with:
          name: masterstrap-ios-build-artifacts
          path: |
            output/*.ipa
            output/flag_inject_report.log
            output/masterstrap_ios.log
            output/FFlags.hpp
            output/Offsets.hpp
          if-no-files-found: warn
