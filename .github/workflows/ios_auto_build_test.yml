name: Masterstrap Roblox iOS Auto Build & Test

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:
    inputs:
      ipa_url:
        description: "Custom HTTPS URL to Decrypted Roblox IPA (optional)"
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:
  build-and-test:
    runs-on: macos-14
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pyyaml capstone

      - name: Resolve & Download Decrypted Roblox iOS IPA
        id: prepare-ipa
        shell: bash
        env:
          INPUT_IPA_URL: ${{ github.event.inputs.ipa_url }}
          SECRET_IPA_URL: ${{ secrets.IOS_IPA_URL }}
        run: |
          mkdir -p roblox_input output
          IPA_PATH="roblox_input/roblox.ipa"
          
          TARGET_URL="$INPUT_IPA_URL"
          if [ -z "$TARGET_URL" ]; then
            TARGET_URL="$SECRET_IPA_URL"
          fi
          
          if [ -z "$TARGET_URL" ]; then
            echo "Searching public verified decrypted mirrors for Roblox IPA..."
            MIRROR=$(curl -s "https://api.github.com/repos/ipahub/roblox/releases/latest" | grep -o 'https://github.com/ipahub/roblox/releases/download/[^"]*\.ipa' | head -n 1 || echo "")
            if [ -n "$MIRROR" ]; then
              TARGET_URL="$MIRROR"
              echo "Found mirror: $TARGET_URL"
            fi
          fi
          
          if [ -n "$TARGET_URL" ]; then
            echo "Downloading Decrypted Roblox IPA from: $TARGET_URL"
            curl -L -o "$IPA_PATH" "$TARGET_URL"
          fi
          
          if [ -f "$IPA_PATH" ] && [ -s "$IPA_PATH" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "ipa_path=$IPA_PATH" >> "$GITHUB_OUTPUT"
            echo "IPA ready ($(du -h "$IPA_PATH" | cut -f1))"
          else
            echo "IPA not downloaded; creating mock binary for dry-run verification..."
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "ipa_path=$IPA_PATH" >> "$GITHUB_OUTPUT"
          fi

      - name: Auto Dump Offsets & FFlags from IPA
        run: |
          echo "=== [1/4] Running iOS Dumper ==="
          mkdir -p output
          if [ "${{ steps.prepare-ipa.outputs.available }}" = "true" ]; then
            python -m roblox_ios_dumper dump "${{ steps.prepare-ipa.outputs.ipa_path }}" -o output
          else
            echo "Downloading reference FFlags from masterstrap.org..."
            curl -s -L "https://masterstrap.org/Data/IOS/IOS_FFlags.hpp" -o "output/FFlags.hpp" || true
            curl -s -L "https://masterstrap.org/Data/IOS/IOS_Offsets.hpp" -o "output/Offsets.hpp" || true
          fi

      - name: Build Masterstrap iOS Native Hook & Integrate IPA
        run: |
          echo "=== [2/4] Compiling Native Hook & Patching IPA ==="
          if [ "${{ steps.prepare-ipa.outputs.available }}" = "true" ]; then
            python tools/build_integrated_roblox_ipa.py \
              --input-ipa "${{ steps.prepare-ipa.outputs.ipa_path }}" \
              --settings-json "Masterstrap/app/src/main/assets/game_presets/default.json" \
              --hpp "output/FFlags.hpp" \
              --out-dir "output"
          else
            echo "Running dry-run hook compilation..."
            python -c "
            import sys
            sys.path.insert(0, 'tools')
            import build_integrated_roblox_ipa as b
            from pathlib import Path
            table = b.fetch_or_load_fflags_map(Path('output/FFlags.hpp'))
            print('Verified loaded FFlags map entries:', len(table))
            "
          fi

      - name: Inspect Verification Log & Miss Offsets
        run: |
          echo "=== [3/4] Inspection Log & Miss Offsets Report ==="
          if [ -f "output/flag_inject_report.log" ]; then
            cat output/flag_inject_report.log
          elif [ -f "output/FFlags.hpp" ]; then
            echo "Dumped FastFlags Header Ready ($(wc -l < output/FFlags.hpp) lines)"
          fi

      - name: Upload Build Artifacts & Logs
        uses: actions/upload-artifact@v4
        with:
          name: masterstrap-ios-build-artifacts
          path: |
            output/Masterstrap-Roblox-Patched.ipa
            output/flag_inject_report.log
            output/FFlags.hpp
            output/Offsets.hpp
            output/*.log
          if-no-files-found: warn
