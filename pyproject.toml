[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "masterstrap-roblox-ios-dumper"
version = "0.1.0"
description = "Deterministic Mach-O metadata, Roblox offset, and FastFlag dumper"
requires-python = ">=3.10"
license = {text = "Private project tooling"}

[project.scripts]
roblox-ios-dumper = "roblox_ios_dumper.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["roblox_ios_dumper*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
